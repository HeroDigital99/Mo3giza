<body class="quran-page">
  <header class="reader-header">
    <a class="reader-brand" href="index.html" aria-label="العودة إلى معجزة"><img src="logo-wordmark.png" alt="معجزة"></a>
    <div class="reader-header-actions">
      <span class="reader-header-mark">المصحف</span>
      <button id="themeToggle" class="reader-theme-toggle" type="button" aria-pressed="false">☾ الوضع الليلي</button>
      <a class="reader-home" href="index.html">العودة إلى الرئيسية</a>
    </div>
  </header>

  <main class="reader-shell">
    <section class="reader-intro" aria-labelledby="readerTitle">
      <span class="reader-kicker">مُصْحَفُ مَعْجِزَة</span>
      <h1 id="readerTitle">القرآن الكريم</h1>
      <p>النص العثماني الموثق — صفحةً بعد صفحة.</p>
    </section>

    <section class="reader-card" aria-label="قارئ القرآن النصي">
      <div class="reader-toolbar">
        <div class="toolbar-title"><span class="toolbar-emblem">آ</span><div><strong>المصحف الشريف</strong><small id="pageLabel">الصفحتان ١ و٢</small></div></div>
        <div class="toolbar-actions"><button id="fontDecrease" class="tool-button" type="button" title="تصغير الخط">A−</button><button id="fontIncrease" class="tool-button" type="button" title="تكبير الخط">A＋</button><button id="bookmarkButton" class="tool-button bookmark-button" type="button">حفظ موضع القراءة</button></div>
      </div>

      <div class="reader-controls">
        <button id="previousPage" class="page-step" type="button" aria-label="الصفحتان السابقتان">السابق <span>→</span></button>
        <div class="page-fields">
          <label class="surah-field">السورة<select id="surahSelect" aria-label="انتقل إلى سورة"></select></label>
          <label class="page-field">الصفحة<span class="page-number-wrap"><input id="pageInput" type="number" min="1" max="604" inputmode="numeric" value="1" aria-label="رقم الصفحة"><span>/ 604</span></span></label>
        </div>
        <button id="nextPage" class="page-step" type="button" aria-label="الصفحتان التاليتان"><span>←</span> التالي</button>
      </div>

      <div class="reader-search" role="search">
        <input id="quranSearchInput" type="search" placeholder="ابحث في القرآن الكريم" aria-label="البحث في القرآن الكريم">
        <button id="quranSearchButton" type="button">بحث</button><button id="quranSearchClear" class="search-clear" type="button" hidden>مسح</button>
        <span id="quranSearchStatus" aria-live="polite"></span>
      </div>
      <div id="quranSearchResults" class="quran-search-results" hidden></div>

      <div id="readerPages" class="reader-pages" aria-live="polite"></div>
      <div class="reader-bookmark-row"><span id="bookmarkStatus">احفظ موضعك لتعود إليه لاحقًا</span><button id="goBookmark" class="text-action" type="button" hidden>الذهاب إلى العلامة</button></div>
    </section>

  </main>

  <footer class="reader-footer"><p>اللهم اجعل القرآن ربيع قلوبنا ونور صدورنا.</p><a href="index.html">معجزة</a><span>برمجة - Hero Digital Company</span><small class="release-version">الإصدار الأول v1.0.0</small></footer>
